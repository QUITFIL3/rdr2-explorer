# Weekly data refresh: pull the latest femga/rdr3_discoveries, re-parse the
# datasets and commit any changes to main. The push then triggers the
# "Deploy to GitHub Pages" workflow automatically.
name: Update data

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout data source
        uses: actions/checkout@v4
        with:
          repository: femga/rdr3_discoveries
          path: .rdr3_discoveries

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Parse datasets
        run: node scripts/parse-data.mjs .rdr3_discoveries

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "Update datasets from femga/rdr3_discoveries"
            git push
          fi
