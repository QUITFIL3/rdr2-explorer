name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Texture samples and model screenshots are not in the repo (multi-GB).
      # Textures are re-downloaded here; model previews are hotlinked to the CDN.
      - name: Download texture samples
        run: npm run download-images
      - name: Build
        env:
          VITE_MODEL_IMG_BASE: https://cdn.jsdelivr.net/gh/BryceCanyonCounty/rdr3-nativedb-data@master/objects/images/
          # grid thumbnails go through a resizing proxy so tiles pull ~8KB WebP
          # instead of the 165-400KB originals
          VITE_MODEL_THUMB_PROXY: https://wsrv.nl/?url=
        run: npx vite build
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
